[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scl-runtime-analyzer"
version = "1.0.0"
description = "Statische WCET-Analyse für Siemens SCL-Funktionsbausteine (S7-300)"
requires-python = ">=3.10,<3.14"
dependencies = [
    "antlr4-python3-runtime==4.13.1",
    "networkx==3.3",
    "click==8.1.7",
    "rich==13.7.1",
    "pydantic>=2.7.1,<3",
    "jinja2==3.1.4",
]

[project.scripts]
scl-analyzer = "src.cli.main:cli"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing"

[tool.setuptools]
packages = ["src"]

[tool.setuptools.package-data]
"src" = ["reporter/templates/*.j2"]
